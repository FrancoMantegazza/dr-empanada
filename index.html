<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Brothers Food.lst · Burgers y cerveza tirada · Boedo</title>
<meta name="theme-color" content="#0c0c0d" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Oswald:wght@500;600;700&family=Bebas+Neue&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/brand.css?v=2" />
<style>
  /* keyframes */
  @keyframes bf-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes bf-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(37,211,102,.5); } 50% { box-shadow: 0 0 0 12px rgba(37,211,102,0); } }
  @keyframes bf-slidein { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .bf-bump { animation: bf-bumpk .35s; }
  @keyframes bf-bumpk { 40% { transform: scale(1.12); } }

  /* responsive */
  .bf-burger { display: none !important; }
  @media (max-width: 900px) {
    .bf-desktop-nav { display: none !important; }
    .bf-order-cta { display: none !important; }
    .bf-burger { display: grid !important; }
    .bf-grid-3 { grid-template-columns: 1fr 1fr !important; }
    .bf-checkout-grid { grid-template-columns: 1fr !important; }
    .bf-rep-grid { grid-template-columns: 1fr !important; }
    .bf-mobcart { display: flex !important; }
    .bf-stats { grid-template-columns: 1fr 1fr !important; }
  }
  @media (max-width: 760px) {
    .bf-metrics { grid-template-columns: 1fr 1fr !important; }
    /* home heroes & sections stack */
    section[style*="grid-template-columns: 1.15fr"],
    section[style*="grid-template-columns: 1fr 1fr"] { }
  }
  @media (max-width: 640px) {
    .wrap { padding-left: 18px; padding-right: 18px; }
    .bf-grid-3 { grid-template-columns: 1fr !important; }
    .bf-admin { grid-template-columns: 1fr !important; }
    .bf-admin-side { position: static !important; height: auto !important; flex-direction: row !important; align-items: center; overflow-x: auto; }
    .bf-admin-side nav { display: flex !important; }
  }
  /* Generic two-col → one-col on small screens for home/about/contact/promo */
  @media (max-width: 820px) {
    .bf-promo { grid-template-columns: 1fr !important; }
    .bf-two { grid-template-columns: 1fr !important; }
  }
</style>
</head>
